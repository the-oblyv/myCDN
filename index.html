<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myCDN</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
body {
  font-family: Arial, sans-serif;
  background: #1e1e1e;
  color: #ddd;
  margin: 0;
  padding: 0;
}
.container {
  max-width: 900px;
  margin: 40px auto;
  background: #2e2e2e;
  border-radius: 10px;
  padding: 20px;
}
ul {
  list-style: none;
  padding-left: 0;
}
li {
  padding: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
}
li i {
  margin-right: 10px;
}
li:hover {
  color: #7c3aed;
}
a {
  color: inherit;
  text-decoration: none;
}
a:hover { text-decoration: underline; }
button {
  margin-bottom: 20px;
  padding: 8px 12px;
  background: #7c3aed;
  color: #fff;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
button:hover { background: #9a5dfb; }
</style>
</head>
<body>
<div class="container">
  <h1>myCDN</h1>
  <div id="file-tree"></div>
</div>

<script>
const repoOwner = "the-oblyv";
const repoName = "myCDN";
const branch = "main";

// Fetch files/folders from GitHub
async function fetchFiles(path = "") {
  const url = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${path}?ref=${branch}`;
  const res = await fetch(url);
  return await res.json();
}

async function showFolders() {
  const container = document.getElementById('file-tree');
  container.innerHTML = ''; // Clear previous
  const items = await fetchFiles();
  items.sort((a,b)=>a.name.localeCompare(b.name, undefined, {sensitivity:'base'}));

  const ul = document.createElement('ul');

  items.forEach(item => {
    if(item.type === 'dir') {
      const li = document.createElement('li');
      li.innerHTML = `<i class="fa-solid fa-folder"></i> ${item.name}`;
      li.addEventListener('click', ()=>showFiles(item.name));
      ul.appendChild(li);
    }
  });

  container.appendChild(ul);
}

// Show files inside a folder with a back button
async function showFiles(folderName) {
  const container = document.getElementById('file-tree');
  container.innerHTML = ''; // Clear previous

  // Back button
  const backBtn = document.createElement('button');
  backBtn.textContent = '← Back';
  backBtn.addEventListener('click', showFolders);
  container.appendChild(backBtn);

  const items = await fetchFiles(folderName);
  items.sort((a,b)=>a.name.localeCompare(b.name, undefined, {sensitivity:'base'}));

  const ul = document.createElement('ul');
  items.forEach(item=>{
    if(item.type === 'file') {
      const ext = item.name.split('.').pop().toLowerCase();
      let iconClass = 'fa-file';
      if(ext==='pdf') iconClass='fa-file-pdf';
      else if(['jpg','jpeg','png','gif','svg'].includes(ext)) iconClass='fa-file-image';
      else if(['mp3','wav'].includes(ext)) iconClass='fa-file-audio';
      else if(['mp4','webm'].includes(ext)) iconClass='fa-file-video';
      else if(['zip','rar','7z'].includes(ext)) iconClass='fa-file-zipper';
      else if(['html','htm','js','css','py','json'].includes(ext)) iconClass='fa-file-code';

      const li = document.createElement('li');
      li.innerHTML = `<i class="fa-solid ${iconClass}"></i> <a href="${item.download_url}" target="_blank">${item.name}</a>`;
      ul.appendChild(li);
    }
  });

  container.appendChild(ul);
}

// Initial load
showFolders();
</script>
</body>
</html>
