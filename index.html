<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myCDN</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
body {
  font-family: Arial, sans-serif;
  background: #1e1e1e;
  color: #ddd;
  margin: 0;
  padding: 0;
}
.container {
  max-width: 900px;
  margin: 40px auto;
  background: #2e2e2e;
  border-radius: 10px;
  padding: 20px;
}
ul {
  list-style: none;
  padding-left: 20px;
}
li {
  padding: 5px 0;
  cursor: pointer;
  display: flex;
  align-items: center;
}
li i {
  margin-right: 8px;
}
li:hover {
  color: #7c3aed;
}
a {
  color: inherit;
  text-decoration: none;
}
a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>myCDN</h1>
  <div id="file-tree"></div>
</div>

<script>
async function loadFiles() {
  const response = await fetch('files.json');
  const data = await response.json();
  const container = document.getElementById('file-tree');
  container.appendChild(createTree(data, true));
}

// Create the folder/file tree
function createTree(node, isRoot = false) {
  if (!node) return;
  const ul = document.createElement('ul');

  if (node.children) {
    // Sort alphabetically
    node.children.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));

    node.children.forEach(child => {
      // Skip showing actual files in root except index.html, files.json, README.md
      if (isRoot && child.type === "file" && !["index.html","files.json","README.md"].includes(child.name)) return;

      const li = document.createElement('li');

      if (child.type === "folder") {
        li.innerHTML = `<i class="fa-solid fa-folder"></i>${child.name}`;
        li.appendChild(createTree(child));
      } else if (child.type === "file") {
        const link = document.createElement('a');
        link.href = child.url;
        link.target = "_blank";

        // Use Font Awesome icon based on file type
        const ext = child.name.split('.').pop().toLowerCase();
        let iconClass = "fa-file";
        if (ext === "pdf") iconClass = "fa-file-pdf";
        else if (["jpg","jpeg","png","gif","svg"].includes(ext)) iconClass = "fa-file-image";
        else if (["mp3","wav","ogg"].includes(ext)) iconClass = "fa-file-audio";
        else if (["mp4","webm","mov"].includes(ext)) iconClass = "fa-file-video";
        else if (["zip","rar","7z"].includes(ext)) iconClass = "fa-file-zipper";
        else if (["html","htm"].includes(ext)) iconClass = "fa-file-code";
        else if (["js","css","py","json"].includes(ext)) iconClass = "fa-file-code";

        li.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
        li.appendChild(link);
        link.textContent = child.name;
      }

      ul.appendChild(li);
    });
  }
  return ul;
}

loadFiles();
</script>
</body>
</html>
