<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myCDN</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
body {
  font-family: Arial, sans-serif;
  background: #1e1e1e;
  color: #ddd;
  margin: 0;
  padding: 0;
}
.container {
  max-width: 900px;
  margin: 40px auto;
  background: #2e2e2e;
  border-radius: 10px;
  padding: 20px;
}
ul {
  list-style: none;
  padding-left: 20px;
}
li {
  padding: 5px 0;
  cursor: pointer;
  display: flex;
  align-items: center;
}
li i {
  margin-right: 8px;
}
li:hover {
  color: #7c3aed;
}
a {
  color: inherit;
  text-decoration: none;
}
a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>myCDN</h1>
  <div id="file-tree"></div>
</div>
<script>
const repoOwner = "the-oblyv";
const repoName = "myCDN";
const branch = "main";

async function fetchFiles(path = "") {
  const url = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${path}?ref=${branch}`;
  const response = await fetch(url);
  const items = await response.json();
  return items;
}

async function buildTree(path = "", container = null, isRoot = false) {
  const items = await fetchFiles(path);
  const ul = document.createElement('ul');

  // Sort alphabetically
  items.sort((a, b) => a.name.localeCompare(b.name, undefined, {sensitivity: 'base'}));

  for (const item of items) {
    // Hide root unwanted files
    if (isRoot && ["index.html", "files.json", "README.md"].includes(item.name)) continue;

    const li = document.createElement('li');

    if (item.type === "dir") {
      // Folder element
      const folderSpan = document.createElement('span');
      folderSpan.innerHTML = `<i class="fa-solid fa-folder"></i> ${item.name}`;
      folderSpan.style.cursor = "pointer";

      // Container for children, hidden by default
      const childContainer = document.createElement('ul');
      childContainer.style.display = "none";
      childContainer.style.paddingLeft = "20px";

      folderSpan.addEventListener('click', async () => {
        if (childContainer.style.display === "none") {
          // Load folder contents only once
          if (childContainer.childElementCount === 0) {
            await buildTree(item.path, childContainer);
          }
          childContainer.style.display = "block";
        } else {
          childContainer.style.display = "none";
        }
      });

      li.appendChild(folderSpan);
      li.appendChild(childContainer);
      ul.appendChild(li);

    } else if (item.type === "file") {
      const ext = item.name.split('.').pop().toLowerCase();
      let iconClass = "fa-file";
      if (ext === "pdf") iconClass = "fa-file-pdf";
      else if (["jpg","jpeg","png","gif","svg"].includes(ext)) iconClass = "fa-file-image";
      else if (["mp3","wav"].includes(ext)) iconClass = "fa-file-audio";
      else if (["mp4","webm"].includes(ext)) iconClass = "fa-file-video";
      else if (["zip","rar","7z"].includes(ext)) iconClass = "fa-file-zipper";
      else if (["html","htm","js","css","py","json"].includes(ext)) iconClass = "fa-file-code";

      li.innerHTML = `<i class="fa-solid ${iconClass}"></i> <a href="${item.download_url}" target="_blank">${item.name}</a>`;
      ul.appendChild(li);
    }
  }

  if (container) container.appendChild(ul);
  else document.getElementById('file-tree').appendChild(ul);
}

// Initialize root
buildTree("", null, true);
</script>
  
</body>
</html>
